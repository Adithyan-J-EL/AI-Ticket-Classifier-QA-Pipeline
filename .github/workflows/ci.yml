name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Unit + API + DB + evaluation tests (with coverage gate)
        run: pytest -m "not ui" --cov --cov-report=term-missing
      - name: UI tests
        run: pytest -m ui
      - name: AI quality gate
        run: python -m evaluation.evaluator
      - name: Save evaluation report
        if: always()
        run: python -m evaluation.evaluator --json > eval-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
